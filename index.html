<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>Explore Indonesia</title>
</head>
<body>
    <nav class="flex flex-row p-4 bg-blue-900 items-center justify-between md:bg-blue-600">
        <h2 class="text-white text-xl font-bold">Explore Indonesia</h2>

        <div>
            <a href="#" class="text-white hover:text-yellow-300">Home</a>
            <a href="#" class="text-white hover:text-yellow-300">Destinations</a>
            <a href="#" class="text-white hover:text-yellow-300">Tentang</a>
        </div>
    </nav>
    <section class="bg-blue-100 p-8">
        <h1 class="text-3xl font-bold text-blue-700 mb-4 animate-bounce">Explore Indonesia</h1>
        <p class="text-lg font-normal text-gray-600">Temukan destinasi indah di Indonesia</p>
        <button class="text-base font-semibold text-white bg-blue-600 px-6 py-3 mt-4 hover:bg-primary">Jelajahi sekarang</button>
    </section>

    <section class="grid grid-cols-3 gap-4">
        <div class="bg-gray-100 p-4 transition duration-300 hover:scale-110 animate-spin">
            <h3>Bali</h3>
            <p>
                Banyak pantai yang indah.
            </p>
        </div>

        <div class="bg-gray-100 p-4 transition duration-300 hover:scale-110 animate-spin">
            <h3>Raja Ampat</h3>
            <p>
                Surga bawah laut indonesia.
            </p>
        </div>

        <div class="bg-gray-100 p-4 transition duration-300 hover:scale-110 animate-spin">
            <h3>Danau Toba</h3>
            <p>
                Danau vulkanik yang menakjubkan.
            </p>
        </div>
    </section>
</body>
</html>
